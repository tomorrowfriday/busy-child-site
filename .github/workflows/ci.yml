name: gates

# The site argues that verification should be a build failure rather than a
# review comment. This is that argument, applied to the site itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types — tsc
        run: npm run typecheck

      - name: Lint — eslint
        run: npm run lint

      - name: Tests + coverage threshold (100%)
        run: npm run coverage

      - name: Build — static export
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: out/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
