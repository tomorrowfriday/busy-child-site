name: gates

# The site argues that verification should be a build failure rather than a
# review comment. This is that argument, applied to the site itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types — tsc
        run: npm run typecheck

      - name: Lint — eslint
        run: npm run lint

      - name: Tests + coverage threshold (100%)
        run: npm run coverage

      - name: Build — static export
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: out/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two audits, because they answer different questions. The first is a
      # gate: anything that reaches a visitor must be clean, and it is what
      # caught the Next.js advisory. The second is a report on build tooling,
      # which ships to nobody — today it is a denial-of-service in a glob
      # library ESLint uses to walk our own source, and there is no patched
      # release to take. Failing the build on something with no fix available
      # trains everyone to ignore a red tick.
      - name: Dependency audit — code that ships
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit — build tooling (reported, not enforced)
        run: npm audit --audit-level=high
        continue-on-error: true
